[project]
name = "resume_builder"
version = "0.1.0"
description = "Tailor your resume using AI agents. Built with CrewAI"
authors = [{ name = "Daniele Loru", email = "futhanos@gmail.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiosqlite>=0.21.0",
  "bcrypt>=5.0.0",
  "crawl4ai>=0.8.6",
  "crewai-tools>=0.76.0",
  "crewai[litellm]>=1.14.2",
  "docxtpl>=0.20.2",
  "fastapi>=0.136.3",
  "pydantic>=2.11.10",
  "pymupdf>=1.26.7",
  "pymupdf-layout>=1.27.2.3",
  "pymupdf4llm>=1.27.2.3",
  "pypdf>=6.9.2",
  "python-docx>=1.2.0",
  "python-jose>=3.5.0",
  "python-multipart>=0.0.26",
  "sqlalchemy[asyncio]>=2.0.0",
  "uvicorn[standard]>=0.44.0",
]

[project.scripts]
resume-builder = "resume_builder.main:app"
plot = "resume_builder.flow:plot"
serve = "resume_builder.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=2.1.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
  "pytest-mock>=3.15.1",
  "ruff>=0.15.15",
]

[tool.mypy]
explicit_package_bases = true

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
ignore = ["B008"]                # FastAPI Depends() in function defaults is idiomatic
