[project]
name = "resume_builder"
version = "0.1.0"
description = "resume_builder using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai[tools]==1.12.2",
  "pydantic>=2.11.10",
  "pymupdf>=1.26.7",
  "pypdf>=6.9.2",
  "python-docx>=1.2.0",
]

[project.scripts]
resume-builder = "resume_builder.main:app"
kickoff = "resume_builder.main:app"
run_crew = "resume_builder.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
