[project]
name = "resume_builder"
version = "0.1.0"
description = "Tailor your resume using AI agents. Built with CrewAI"
authors = [{ name = "Daniele Loru", email = "futhanos@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
  "crawl4ai>=0.8.6",
  "crewai-tools>=0.76.0",
  "crewai[litellm]>=1.14.2",
  "docxtpl>=0.20.2",
  "pydantic>=2.11.10",
  "pymupdf>=1.26.7",
  "pymupdf-layout>=1.27.2.3",
  "pymupdf4llm>=1.27.2.3",
  "pypdf>=6.9.2",
  "python-docx>=1.2.0",
]

[project.scripts]
resume-builder = "resume_builder.main:app"
plot = "resume_builder.flow:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[dependency-groups]
dev = ["mypy>=2.1.0", "pytest>=9.0.3", "pytest-mock>=3.15.1", "ruff>=0.15.15"]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
