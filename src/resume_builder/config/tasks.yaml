analyze_job_task:
  description: >
    You have been given the raw text of a job posting. Analyse it thoroughly
    and extract every signal about what this employer is looking for.

    Job posting:
    ---
    {job_posting_raw}
    ---

    Your task:

    1. Extract the EXACT job title and company name as written.
    2. Determine seniority level from the context (years of experience required,
       complexity of responsibilities, reporting structure if mentioned).
    3. Separate required skills from preferred skills carefully. "Required",
       "must have", "you will need" = required. "Preferred", "nice to have",
       "a plus", "bonus" = preferred.
    4. List key responsibilities — what will this person actually be doing day-to-day?
    5. Build the ATS keywords list: pull exact phrases from the posting that an ATS
       would scan for. Include specific technologies, methodologies, frameworks,
       certifications, and role-specific verbs.
    6. Note industry, team size, and remote policy if mentioned.
    7. Preserve the full raw_posting text.

  expected_output: >
    A fully structured JobRequirements object. The ats_keywords field must contain
    at least 10 specific, exact-match keywords or phrases from the posting.

  agent: job_analyzer

build_strategy_task:
  description: >
    You have the candidate's structured profile and the job requirements.
    Build a precise tailoring strategy.

    The candidate's parsed resume is available as structured JSON:
    ---
    {parsed_resume_json}
    ---

    The full parsed job requirements (JobRequirements object) are available
    in your context from the analyze_job_task, including the exact job title,
    company, seniority level, required/preferred skills, key responsibilities,
    and ATS keywords. The raw job posting is also available for reference.

    Your task:

    1. Calculate an honest match score (0–100) before any tailoring. Be realistic.
    2. Identify which of the candidate's skills and experiences are MOST relevant
       to this role — these should be front and centre.
    3. Identify which skills should be deprioritised (irrelevant to this role).
    4. For each required or preferred skill the candidate has, note the strongest
       evidence of it in their experience.
    5. Identify the 3–5 bullet points from the candidate's experience that most
       need to be rewritten for better alignment with this role.
    6. Define the narrative angle for the professional summary — what is the one
       sentence that best positions this candidate for this role?
    7. List every ATS keyword that must appear in the resume.
    8. Be direct about gaps: list what's missing and how to address it honestly.
       Never suggest fabricating experience or skills.
    9. State clearly in honest_constraints what the writer must NOT claim.

  expected_output: >
    A detailed TailoringStrategy object. The gaps_and_mitigations field must
    address every required skill that the candidate lacks. The summary_angle
    must be a concrete, one-sentence narrative directive for the writer.

  agent: resume_strategist

write_resume_task:
  description: >
    You are writing a tailored resume.

    You have access to:
    - The candidate's full parsed resume as structured JSON:
      ---
      {parsed_resume_json}
      ---
    - GitHub projects (if available) as JSON:
      ---
      {projects_json}
      ---
    - The structured job requirements (from context)
    - The tailoring strategy (from context)

    Write the complete tailored resume following these rules:

    PROFESSIONAL SUMMARY:
    - 3–5 sentences maximum
    - Open with the candidate's most relevant identity for THIS role
    - Weave in 2–3 ATS keywords naturally
    - No generic filler ("results-driven professional", "team player")
    - Follow the summary_angle from the strategy exactly

    EXPERIENCE:
    - Keep ALL original experience entries (do not remove any)
    - Rewrite bullets from the strategy's experience_bullets_to_rewrite list
    - Every rewritten bullet starts with a strong past-tense action verb
    - Quantify impact wherever the original data supports it
    - Remove bullets that have zero relevance to the target role
    - Add ATS keywords naturally into bullet points where truthful
    - NEVER invent metrics, achievements, or responsibilities

    PROJECTS (if projects_json is non-empty):
    - Include 2–4 of the most relevant GitHub projects for this role
    - For each project write 1–2 bullet points highlighting:
      the tech stack, architecture decisions, and measurable impact
    - Focus on projects that demonstrate skills the target job requires
    - NEVER invent features, technologies, or metrics not in the source

    SKILLS:
    - Lead with the skills_to_emphasise from the strategy
    - Include skills demonstrated in the GitHub projects where relevant
    - Include all required skills the candidate genuinely has
    - Omit skills marked for deprioritisation
    - Maximum 20 skills total
    - Group them logically (e.g. "Languages: Python, Go, SQL")

    PUBLICATIONS:
    - Include publications that are relevant to the target role or industry
    - Prioritise recent and high-impact publications
    - Preserve the title, venue, date, publisher, and link for each
    - Limit to the most relevant 5-10 if the candidate has many

    WORKSHOPS:
    - Include workshops that demonstrate continuous learning relevant to the role
    - Prioritise recent workshops and those aligned with required skills
    - Preserve the title, date, and place for each

    AWARDS:
    - Include all awards — they are always valuable for credibility
    - Preserve the title, organization, and date for each
    - Order by date (most recent first)

    INTERNATIONAL EXPERIENCES:
    - Include all international experiences — they demonstrate adaptability
    - Preserve the place, date, and description for each
    - Highlight any cross-cultural or international collaboration skills

    QUALITY BAR:
    - Every claim must be supported by the original resume or project data
    - Respect all honest_constraints from the strategy
    - The resume must read as written by a human professional, not an AI

  expected_output: >
    A complete TailoredResume object with all fields populated. The
    ats_keyword_coverage list must contain every keyword from the strategy
    that appears in the final resume. The confidence_score must reflect
    an honest assessment. The tailoring_notes must explain the key decisions
    made (3–5 sentences).

  agent: resume_writer

review_resume_task:
  description: >
    You are performing a final quality review of a tailored resume.

    You have access to:
    - The candidate's full parsed resume as structured JSON:
      ---
      {parsed_resume_json}
      ---
    - The draft tailored resume (from write_resume_task, in context).
    - The tailoring strategy (from context).

    Review it against these quality criteria:

    CONTENT QUALITY:
    □ Does the summary open with the right angle for this role?
    □ Does every bullet point start with a strong action verb?
    □ Are achievements quantified wherever possible?
    □ Are there any generic or weak bullets that should be rewritten?
    □ Is anything vague where it should be specific?

    ATS OPTIMISATION:
    □ Do all required ATS keywords appear in the resume?
    □ Are keywords integrated naturally, not stuffed?
    □ Does the job title in the summary match or closely mirror the posting?

    ACCURACY & HONESTY:
    □ Does every claim align with the original resume?
    □ Are there any exaggerated or fabricated claims?
    □ Are all honest_constraints from the strategy respected?

    CONSISTENCY:
    □ Are dates formatted consistently throughout?
    □ Are bullet points grammatically parallel?
    □ Is the skills list free of duplicates?

    ADDITIONAL SECTIONS:
    □ Are publications formatted correctly with title, venue, date, and link?
    □ Are workshops listed with title, date, and place?
    □ Are awards listed with title, organization, and date?
    □ Are international experiences included with place, date, and description?
    □ Do all entries in these sections match the original parsed resume data?

    Your output is the FINAL, polished TailoredResume object. Make targeted
    improvements where the criteria above are not met. Update the confidence_score
    to reflect the final quality. Add a final review note to tailoring_notes.

  expected_output: >
    The final, polished TailoredResume object. This is the deliverable.
    All fields must be complete and the resume must pass all quality criteria above.
    The confidence_score should reflect the final post-review assessment.

  agent: quality_reviewer
