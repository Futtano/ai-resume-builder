resume_parsing_task:
  description: >
    You have been given the raw text of a candidate's resume, extracted from
    their PDF.

    Raw resume text: --- {resume_raw_text} ---

    Additional context the candidate provided about themselves: ---
    {intro_brief} ---

    Your task is to parse this resume completely and structure all the
    information into a well-organised data model. Follow these rules:

    1. Extract ALL experience entries — do not skip any role, even short-term
    ones. 2. For each experience entry, identify the skills demonstrated from
    the bullet
      points and context, even if not explicitly listed.
    3. Compile a comprehensive skills list — include technical skills, tools,
      frameworks, methodologies, and soft skills visible anywhere in the resume.
    4. Preserve the exact text of bullet points for now; the writer will improve
      them later. Do NOT invent or embellish.
    5. Estimate the total years of experience by summing the duration of all
    roles.
      The total MUST be an integer number.
    6. Extract ALL publications — for each, capture the title, venue
    (conference/journal),
      publisher, date, and link (URL or DOI). Return empty list if none found.
    7. Extract ALL workshop participations — for each, capture the title, date,
    and place.
      Return empty list if none found.
    8. Extract ALL awards and recognitions — for each, capture the title,
    organization,
      and date. Return empty list if none found.
    9. Extract ALL international experiences (study abroad, work exchanges,
    etc.) —
        for each, capture the place, date/period, and a brief description.
    Return empty list if none found. 10. NEVER FABRICATE ANY INFORMATION. Only
    extract what is explicitly stated in the resume.
  expected_output: >
    A fully structured ParsedResume object with all fields populated. Every
    section of the resume must be represented. No information should be lost.
    The publications, workshops, awards, and international_experiences lists
    must contain all entries found in the resume, or be empty lists if none
    exist.
  agent: resume_parser

project_parsing_task:
  description: >
    You are given the following information for different GitHub repositories.
    Your task is to accurately build a structured representation of the
    information for each repository, into a neat, clear and properly formatted
    object. You should NEVER make up any information, you just provide the best
    possible structured representation of the following information.  ----
    GITHUB REPOSITORIES INFO ----  {github_info} ---- END GITHUB REPOSITORIES
    INFO ----
  expected_output: >
    A fully structured Projects object, representing the search results for each
    repository. No information should be lost.
  agent: project_parser
