parse_repo:
  description: >
    You are given a GitHub repository to analyse. Your task is to fetch
    information from the repository and build a detailed, structured
    representation of the project.

    Steps:
    1. Use the github_list_dir tool to explore the top-level directory
       structure of the repository.
    2. Use the github_file_read tool to fetch key files that help you
       understand the project. Typically this includes README.md for the
       project description and pyproject.toml (or package.json, Cargo.toml,
       etc.) for the tech stack.
    3. Build a ProjectEntry model from the fetched content. You should NEVER
       make up any information — only use what is present in the fetched
       files.

    Repository: {source}
    Source type: {source_type}
  expected_output: >
    A fully structured ProjectEntry object, describing the project in a
    structured, detailed and insightful way. No information should be lost
    and nothing should be fabricated.
  agent: repo_parser
