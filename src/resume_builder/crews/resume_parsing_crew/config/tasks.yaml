parse_resume:
  description: >
    You have been given the raw text of a candidate's resume. Your task is to
    parse this resume completely and structure all the information into a
    well-organised data model. If given, take also into account a brief
    professional introduction given by the candidate.

    Brief professional introduction:
    {intro_brief}

    Raw text of the candidate's resume:
    {resume_raw_text}
  expected_output: >
    A fully structured ParsedResume object with all fields populated. Every
    section of the resume must be represented. No information should be lost.
    The publications, workshops, awards, and international_experiences lists
    must contain all entries found in the resume, or be empty lists if none
    exist.
  agent: resume_parser
